<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NAS 文件</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6fed' d='M4 4h6l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<!-- ---------------------------------------------------------------- 登录 -->
<div id="login-view" class="view">
  <form id="login-form" class="card login-card" autocomplete="off">
    <div class="logo" aria-hidden="true">📁</div>
    <h1>NAS 文件管理</h1>
    <p class="hint">输入访问密码</p>
    <input id="password" class="input" type="password" placeholder="密码"
           autocomplete="current-password" required>
    <button type="submit" class="btn primary block">登录</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<!-- ---------------------------------------------------------------- 主界面 -->
<div id="app-view" class="view hidden">
  <header class="topbar">
    <div class="topbar-row">
      <button id="btn-up" class="btn icon" title="上一级" disabled>↑</button>
      <nav id="crumbs" class="crumbs"></nav>
    </div>
    <div class="actions">
      <button id="btn-refresh" class="btn">刷新</button>
      <button id="btn-pick" class="btn primary">上传文件</button>
      <button id="btn-dir" class="btn">上传文件夹</button>
      <button id="btn-logout" class="btn ghost">登出</button>
      <input id="file-input" type="file" multiple hidden>
      <input id="dir-input" type="file" multiple webkitdirectory hidden>
    </div>
  </header>

  <main id="main">
    <div id="empty" class="empty hidden">这个目录是空的，把文件或文件夹拖进来即可上传</div>
    <table class="list">
      <thead>
        <tr>
          <th class="c-name">名称</th>
          <th class="c-size">大小</th>
          <th class="c-time">修改时间</th>
          <th class="c-ops">操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <section id="queue" class="queue"></section>
  <div id="drop-overlay" class="drop-overlay hidden"><div>松开鼠标，上传到当前目录</div></div>

  <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true">
    <div class="viewer-bar">
      <span id="viewer-title" class="viewer-title"></span>
      <a id="viewer-download" class="btn small" href="#">下载</a>
      <button id="viewer-close" class="btn small ghost">关闭</button>
    </div>
    <div id="viewer-body" class="viewer-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
